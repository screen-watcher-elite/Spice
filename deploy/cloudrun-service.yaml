apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aegismesh
  labels:
    app: aegismesh
    compliance: rbi-dpdp-2023
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: aegismesh
          image: asia-south1-docker.pkg.dev/PROJECT_ID/aegismesh/aegismesh:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: AEGIS_HOST
              value: "0.0.0.0"
            - name: GEMINI_AGENT_MODEL
              value: "gemini-3.5-flash-lite"
            - name: GEMINI_DECISION_MODEL
              value: "gemini-decision-1"
            - name: GEMINI_SENTINEL_MODEL
              value: "gemini-3-flash-preview"
            - name: RUST_LOG
              value: "info"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aegismesh-gemini-api-key
                  key: latest
            - name: AEGIS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: aegismesh-admin-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
